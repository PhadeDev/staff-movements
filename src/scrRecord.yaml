Screens:
  scrRecord:
    Properties:
      Fill: =RGBA(248,248,248,1)
      OnVisible: |-
        =Set(varShowEditPanel, false);
        Set(varShowLeaverPanel, false);
        Set(varWizardStage, "core")
    Children:
      - recHeader:
          Control: Classic/Button@2.2.0
          Properties:
            X: =0
            Y: =0
            Width: =1366
            Height: =56
            Fill: =RGBA(0,78,66,1)
            HoverFill: =Self.Fill
            PressedFill: =Self.Fill
            DisabledFill: =Self.Fill
            BorderThickness: =0
            DisplayMode: =DisplayMode.View
            Text: =""
      - btnBack:
          Control: Classic/Button@2.2.0
          Properties:
            X: =8
            Y: =8
            Width: =40
            Height: =40
            Text: ="‹"
            Color: =RGBA(255,255,255,1)
            Fill: =RGBA(255,255,255,0.12)
            HoverFill: =RGBA(255,255,255,0.22)
            PressedFill: =RGBA(255,255,255,0.32)
            DisabledFill: =RGBA(0,0,0,0)
            BorderThickness: =0
            Size: =24
            OnSelect: |-
              =If(
                  varShowLeaverPanel || varShowEditPanel,
                  Set(varShowLeaverPanel, false);
                  Set(varShowEditPanel, false),
                  Navigate(scrDashboard, ScreenTransition.UnCover)
              )
      - lblRecordTitle:
          Control: Label@2.5.1
          Properties:
            X: =60
            Y: =0
            Width: =900
            Height: =56
            Text: =Coalesce(varSelectedRecord.Title, "Record")
            Color: =RGBA(255,255,255,1)
            Size: =18
            FontWeight: =FontWeight.Bold
            VerticalAlign: =VerticalAlign.Middle
      - recCompleteTagPill:
          Control: Classic/Button@2.2.0
          Properties:
            X: =1120
            Y: =14
            Width: =110
            Height: =28
            Text: =""
            Visible: =varSelectedRecord.Complete
            Fill: =RGBA(210,245,220,1)
            HoverFill: =Self.Fill
            PressedFill: =Self.Fill
            DisabledFill: =Self.Fill
            BorderThickness: =0
            RadiusTopLeft: =14
            RadiusTopRight: =14
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            DisplayMode: =DisplayMode.View
      - lblCompleteTag:
          Control: Label@2.5.1
          Properties:
            X: =1120
            Y: =14
            Width: =110
            Height: =28
            Text: ="Complete"
            Visible: =varSelectedRecord.Complete
            Color: =RGBA(0,100,30,1)
            Size: =12
            FontWeight: =FontWeight.Semibold
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
      - recActionBar:
          Control: Classic/Button@2.2.0
          Properties:
            X: =0
            Y: =56
            Width: =1366
            Height: =52
            Fill: =RGBA(255,255,255,1)
            HoverFill: =Self.Fill
            PressedFill: =Self.Fill
            DisabledFill: =Self.Fill
            BorderColor: =RGBA(220,220,220,1)
            BorderThickness: =0
            DisplayMode: =DisplayMode.View
            Text: =""
      - recActionBarBorder:
          Control: Classic/Button@2.2.0
          Properties:
            X: =0
            Y: =107
            Width: =1366
            Height: =1
            Fill: =RGBA(220,220,220,1)
            HoverFill: =Self.Fill
            PressedFill: =Self.Fill
            DisabledFill: =Self.Fill
            BorderThickness: =0
            DisplayMode: =DisplayMode.View
            Text: =""
      - btnEditDetails:
          Control: ModernButton@1.0.0
          Properties:
            X: =20
            Y: =64
            Width: =130
            Height: =36
            Text: ="Edit Details"
            BasePaletteColor: =RGBA(80,80,80,1)
            OnSelect: |-
              =Set(varShowEditPanel, true);
              Reset(drpEditMovType);
              Reset(drpEditPosType);
              Reset(drpEditMMLOrMOVD)
      - btnMarkComplete:
          Control: ModernButton@1.0.0
          Properties:
            X: =164
            Y: =64
            Width: =160
            Height: =36
            Text: ="Mark Complete"
            BasePaletteColor: =RGBA(0,78,66,1)
            Visible: =!varSelectedRecord.Complete
            OnSelect: |-
              =Patch('Staff Movements (LTD)', varSelectedRecord,
                  {Complete: true, DateCompleted: Today()}
              );
              Set(varSelectedRecord, LookUp('Staff Movements (LTD)', ID = varSelectedRecord.ID));
              ClearCollect(colMovements, 'Staff Movements (LTD)');
              Notify("Marked as complete.", NotificationType.Success)
      - btnReOpen:
          Control: ModernButton@1.0.0
          Properties:
            X: =164
            Y: =64
            Width: =120
            Height: =36
            Text: ="Re-Open"
            BasePaletteColor: =RGBA(120,120,120,1)
            Visible: =varSelectedRecord.Complete
            OnSelect: |-
              =Patch('Staff Movements (LTD)', varSelectedRecord,
                  {Complete: false, DateCompleted: Blank()}
              );
              Set(varSelectedRecord, LookUp('Staff Movements (LTD)', ID = varSelectedRecord.ID));
              ClearCollect(colMovements, 'Staff Movements (LTD)');
              Notify("Record re-opened.", NotificationType.Success)
      - btnLeaverProcess:
