            X: =28
            Y: =396
            Width: =300
            Height: =40
            SelectedDate: =varSelectedRecord.'Confirmed Start Date'
            Visible: =(varWizardStage = "core") && (varSelectedRecord.'Movement Type'.Value = "New to MoD/Branch" || varSelectedRecord.'Movement Type'.Value = "Moving to Branch")
