            Y: =64
            Width: =180
            Height: =36
            Text: ="Leaver Process ›"
            BasePaletteColor: =RGBA(163,100,0,1)
            Visible: =!(varSelectedRecord.'Movement Type'.Value = "Leaving Branch" || varSelectedRecord.'Movement Type'.Value = "Leaving MoD")
            OnSelect: =Set(varShowLeaverPanel, true)

